[project]
name = "marama-2026"
version = "0.1.0"
description = "Python Tutorial Course for Air Quality Managers" 
readme = "README.md"
authors = [
    { name = "Maurice Roots", email = "mrmoroots@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Sessions 1 and 2
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
# pip install "marama_2026[session3]"   (or [session4], or [all])
session3 = [
    "xarray",
    "netcdf4",
    "geopandas",
    "cartopy",
    "metpy",
    "plotly",
    "act-atmos",
    "pyrsig",
    "atmoz[lidar] @ git+https://github.com/moroots/atmoz",
]
session4 = [
    "requests",
    "cartopy",
    "herbie-data",
    "cfgrib",
    "eccodes",
    "scikit-learn",
]
all = ["marama-2026[session3,session4]"]

[project.scripts]
marama-2026 = "marama_2026:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
