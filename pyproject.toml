[project]
name = "marama-2026"
version = "0.1.0"
description = "Python Tutorial Course for Air Quality Managers" 
readme = "README.md"
authors = [
    { name = "Maurice Roots", email = "mrmoroots@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "scipy>=1.18.1",
]

[project.scripts]
marama-2026 = "marama_2026:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
